name: Node CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Render Hollowfang PNG previews
        run: node --import tsx scripts/preview-hollowfang-xp.ts
      - name: Upload rendered preview cards
        uses: actions/upload-artifact@v4
        with:
          name: hollowfang-gothic-previews
          path: artifacts/hollowfang-preview/*.png
          if-no-files-found: error
